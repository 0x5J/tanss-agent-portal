name: Release

# Ein Tag vX.Y.Z baut beide Images (Portal und Updater) auf ghcr.io mit dem
# Tag X.Y.Z und legt ein GitHub-Pre-Release mit dem passenden Abschnitt aus
# CHANGELOG.md sowie compose.yaml und env.example an. staging rueckt nur nach,
# wenn der Tag die hoechste Version ist. latest und X.Y setzt erst
# promote.yml, wenn das Pre-Release freigegeben wird. Beide Images bekommen
# einen signierten Build-Provenance-Nachweis (Sigstore), den der Updater vor
# jedem Update prueft.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/0x5j/tanss-agent-portal
  IMAGE_UPDATER: ghcr.io/0x5j/tanss-agent-portal-updater

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # all tags, to tell whether this one is the highest version
          fetch-depth: 0

      - name: Tag, package.json und Changelog abgleichen
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$version" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zu package.json ($pkg)"
            exit 1
          fi
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md hat keinen Abschnitt für $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: staging nur fuer die hoechste Version
        id: staging
        run: |
          git fetch --force --tags origin
          highest="$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)"
          if [ "$highest" = "$GITHUB_REF_NAME" ]; then
            echo "move=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$GITHUB_REF_NAME ist nicht die hoechste Version ($highest): staging bleibt"
            echo "move=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix updater
      - run: npm run check

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=staging,enable=${{ steps.staging.outputs.move == 'true' }}
          labels: |
            org.opencontainers.image.title=Agent-Portal für TANSS
            org.opencontainers.image.licenses=MIT
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=portal
          cache-to: type=gha,mode=max,scope=portal
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - id: meta-updater
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_UPDATER }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=staging,enable=${{ steps.staging.outputs.move == 'true' }}
          labels: |
            org.opencontainers.image.title=Agent-Portal für TANSS (Updater)
            org.opencontainers.image.licenses=MIT
      - id: build-updater
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: updater/Dockerfile
          build-args: |
            UPDATER_VERSION=${{ steps.version.outputs.version }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-updater.outputs.tags }}
          labels: ${{ steps.meta-updater.outputs.labels }}
          cache-from: type=gha,scope=updater
          cache-to: type=gha,mode=max,scope=updater
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_UPDATER }}
          subject-digest: ${{ steps.build-updater.outputs.digest }}
          push-to-registry: true

      - name: GitHub-Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        # GitHub renames asset names with a leading dot, so the .env template
        # goes up as env.example.
        run: |
          cp .env.example "$RUNNER_TEMP/env.example"
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --prerelease \
            --title "$VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            compose.yaml "$RUNNER_TEMP/env.example"
