name: Promote

# Gibt eine getestete Version frei: Sobald ein Pre-Release in GitHub zum
# Release gemacht wird (Haken "Pre-release" entfernt), zeigen latest und X.Y
# auf genau dieselben Images (Digest) wie X.Y.Z -- es wird nichts neu gebaut.
# latest rueckt nur fuer die hoechste freigegebene Version nach, X.Y nur fuer
# die hoechste ihrer Reihe; ein Patch einer aelteren Reihe dreht nichts zurueck.
on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      version:
        description: "Version ohne v, z. B. 0.2.0"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: promote
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/0x5j/tanss-agent-portal
  IMAGE_UPDATER: ghcr.io/0x5j/tanss-agent-portal-updater

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Version bestimmen
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          raw="${RELEASE_TAG:-$INPUT_VERSION}"
          version="${raw#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$raw' ist keine Version der Form X.Y.Z"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags latest und X.Y setzen
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MINOR: ${{ steps.version.outputs.minor }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Nur freigegebene Versionen zaehlen; ein hoeheres Pre-Release haelt
          # einen Patch nicht von latest fern.
          released="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')"
          versions="$( { printf '%s\n' "$released" | sed 's/^v//'; echo "$VERSION"; } \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -uV)"
          highest="$(printf '%s\n' "$versions" | tail -n 1)"
          highest_minor="$(printf '%s\n' "$versions" | awk -v m="$MINOR." 'index($0, m) == 1' | tail -n 1)"

          tags=()
          if [ "$highest" = "$VERSION" ]; then
            tags+=(latest)
          else
            echo "::notice::$VERSION ist nicht die hoechste freigegebene Version ($highest): latest bleibt"
          fi
          if [ "$highest_minor" = "$VERSION" ]; then
            tags+=("$MINOR")
          else
            echo "::notice::$VERSION ist nicht die hoechste Version der Reihe $MINOR ($highest_minor): $MINOR bleibt"
          fi
          [ "${#tags[@]}" -gt 0 ] || exit 0

          for image in "$IMAGE" "$IMAGE_UPDATER"; do
            args=()
            for tag in "${tags[@]}"; do args+=(-t "$image:$tag"); done
            docker buildx imagetools create "${args[@]}" "$image:$VERSION"
          done
