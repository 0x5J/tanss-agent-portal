# Haelt die per Commit-Hash festgelegten Actions in .github/workflows und die
# Sigstore-Pakete des Updaters (updater/package.json) aktuell.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /updater
    schedule:
      interval: monthly
    groups:
      sigstore:
        patterns: ["@sigstore/*"]
