services:
  portal:
    image: ghcr.io/0x5j/tanss-agent-portal:${PORTAL_TAG:-latest}
    restart: unless-stopped
    # TANSS_BASE_URL, SESSION_SECRET und optional TOTP_SECRET kommen zur
    # Laufzeit aus der lokalen .env und landen nicht im Image.
    env_file: .env
    environment:
      SERVE_STATIC: "1"
      PORT: "3848"
      BIND: 0.0.0.0
      ALLOW_ALL_INTERFACES: "1"
      TZ: Europe/Berlin
      DATA_DIR: /app/data
    # KI-Einstellungen (inkl. API-Key) und Freigabe-Queue bleiben auf dem Host.
    volumes:
      - ./data:/app/data
    # Das lokale LLM (oMLX, Ollama, LM Studio) laeuft auf dem Host:
    # in den Einstellungen http://host.docker.internal:<port> eintragen.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Loopback only: aus dem Netz ist nichts erreichbar.
    ports:
      - "127.0.0.1:${HOST_PORT:-3848}:3848"
    security_opt:
      - no-new-privileges:true

  # Spielt Updates ein: zieht das neue Image und startet den Portal-Container
  # neu. Einziger Dienst mit Docker-Zugriff (Socket) und ohne Ports. Das
  # Portal selbst hat keinen Docker-Zugriff und reicht nur eine Versionsnummer
  # ueber ./data/update weiter.
  updater:
    image: ghcr.io/0x5j/tanss-agent-portal-updater:${PORTAL_TAG:-latest}
    restart: unless-stopped
    # Ein laufendes Update darf zu Ende laufen (Herkunftspruefung, Stopp 30 s
    # + Pruefung 90 s); wird es trotzdem abgebrochen, raeumt der Updater beim
    # naechsten Start auf.
    stop_grace_period: 4m
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/update:/update
    security_opt:
      - no-new-privileges:true
